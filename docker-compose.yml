services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaflow_local}
      POSTGRES_DB: aquaflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aquaflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow -d aquaflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aquaflow_pg:

